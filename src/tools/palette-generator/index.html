<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Palette Generator — Ivy Puckett</title>
  <meta name="description" content="Generate harmonious colour palettes using colour-theory schemes." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #666;
      --accent: #2e7d5b;
      --card: #f5f6f5;
      --border: #e2e4e3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1211;
        --fg: #e8eae9;
        --muted: #9aa3a0;
        --accent: #5fd6a0;
        --card: #171b1a;
        --border: #262b29;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      padding: 2rem 1.25rem 4rem;
    }
    main { max-width: 680px; margin: 0 auto; }
    .back { display: inline-block; text-decoration: none; color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .back:hover { color: var(--accent); }
    .badge { display: inline-block; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
    h1 { font-size: clamp(1.9rem, 5vw, 2.75rem); margin: 0.25rem 0 1.5rem; }
    label { display: block; margin-top: 0.75rem; font-size: 0.9rem; color: var(--muted); }
    input[type="range"] { width: 100%; }
    select { margin-top: 0.35rem; padding: 0.4rem; background: var(--card); color: var(--fg); border: 1px solid var(--border); border-radius: 0.4rem; }
    footer { margin-top: 3rem; font-size: 0.85rem; color: var(--muted); }

    #paletteGenerator {
      display: flex;
      flex-direction: column;
      max-width: 60ch;
      margin: auto;
    }
    #paletteCanvas {
      margin: auto;
      width: 60vh;
      max-width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(white 0%, transparent 75%),
        conic-gradient(hsl(0 100% 50%),
          hsl(45 100% 50%),
          hsl(90 100% 50%),
          hsl(135 100% 50%),
          hsl(180 100% 50%),
          hsl(225 100% 50%),
          hsl(270 100% 50%),
          hsl(315 100% 50%),
          hsl(360 100% 50%));
      background-blend-mode: screen;
    }
    #huePreview { margin-top: 1.5rem; }

    #cssExport { margin-top: 2.5rem; }
    #cssExport h2 { font-size: 1.1rem; margin: 0; }
    .css-export-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }
    #copyCss {
      font: inherit;
      font-size: 0.85rem;
      padding: 0.35rem 0.8rem;
      color: var(--bg);
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 0.4rem;
      cursor: pointer;
    }
    #copyCss:hover { opacity: 0.85; }
    #copyCss[data-state="copied"] { background: var(--card); color: var(--accent); }
    #copyCss[data-state="failed"] { background: var(--card); color: var(--muted); border-color: var(--border); }
    #cssOutput {
      margin: 0;
      padding: 1rem;
      max-height: 22rem;
      overflow: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      font-size: 0.85rem;
      line-height: 1.5;
      tab-size: 2;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">← 🌿 Ivy Puckett</a>
    <div class="badge">Web tool</div>
    <h1>Palette Generator</h1>

    <form id="paletteGenerator" name="paletteGenerator">
      <canvas id="paletteCanvas" width="360" height="50"></canvas>

      <label for="paletteType">Palette Type</label>
      <select id="paletteType" onchange="updatePalette()">
        <option value="single">Single</option>
        <option value="complementary">Complementary</option>
        <option value="splitComplementary">Split Complementary</option>
        <option value="triad" selected>Triad</option>
        <option value="square">Square</option>
        <option value="analogous">Analogous</option>
        <option value="rotations">Rotation Count</option>
      </select>
      <div id="rotationsWrapper" style="display:none;">
        <label for="rotations">Rotations</label><input id="rotations" oninput="updatePalette()" type="range" min="1"
          max="12" value="3" />
      </div>
      <label for="startingHue">Hue</label><input id="startingHue" oninput="updatePalette()" type="range" min="0" max="360"
        value="185" />
      <label for="shift">Hue Shift</label><input id="shift" oninput="updatePalette()" type="range" min="0" max="30"
        value="10" />
      <label for="dynamicRange">Shades / Tints</label><input id="dynamicRange" oninput="updatePalette()" type="range"
        min="2" max="16" step="2" value="4" />

      <label for="saturation">Saturation</label><input id="saturation" oninput="updatePalette()" type="range" min="1"
        max="100" value="40" />
      <label for="saturationShift">Saturation Shift</label><input id="saturationShift" oninput="updatePalette()" type="range"
        min="1" max="100" value="50" />
      <div id="huePreview"></div>
    </form>

    <section id="cssExport">
      <div class="css-export-head">
        <h2>CSS</h2>
        <button id="copyCss" type="button" onclick="copyCss()">Copy CSS</button>
      </div>
      <pre id="cssOutput"><code></code></pre>
      <p id="copyStatus" role="status" aria-live="polite" class="visually-hidden"></p>
    </section>

    <footer>Part of <a href="/">Ivy Puckett's</a> portfolio.</footer>
  </main>

  <script>
    // the current color palette
    let palette = {}

    // pending reset of the copy button's transient label
    let copyResetTimer

    // Where each scheme puts its hues, in degrees from the chosen hue. Analogous
    // sits either side of that hue rather than starting on it, so the Hue slider
    // stays the middle of the run; split complementary flanks the complement at
    // 180 ± 30 instead of dividing the wheel evenly.
    const schemeHueOffsets = {
      single: [0],
      complementary: [0, 180],
      splitComplementary: [0, 150, 210],
      triad: [0, 120, 240],
      square: [0, 90, 180, 270],
      analogous: [-30, 0, 30]
    }

    // main
    function updatePalette() {
      let paletteType = document.querySelector("#paletteType").value
      let options = {
        startingHue: parseInt(document.querySelector('#startingHue').value),
        hueShift: parseFloat(document.querySelector('#shift').value) / 100,
        saturation: parseInt(document.querySelector('#saturation').value),
        saturationShift: parseInt(document.querySelector('#saturationShift').value) / 100,
        dynamicRange: parseInt(document.querySelector('#dynamicRange').value)
      }

      if (paletteType === 'rotations') {
        showRotations()
        palette = getColorPaletteFromRotations({
          ...options,
          rotations: parseInt(document.querySelector('#rotations').value)
        })
      } else {
        hideRotations()
        palette = getColorPaletteFromOffsets({ ...options, hueOffsets: schemeHueOffsets[paletteType] })
      }

      createButtonsAndUpdateCssVariables(palette)
      updateCanvas(palette)
      updateCssExport(palette)
    }
    window.onload = updatePalette()

    // color calculations
    function getColorPaletteFromRotations({ startingHue, hueShift, saturation, saturationShift, dynamicRange, rotations }) {
      let rotationStop = Math.floor(360 / rotations)
      let hueOffsets = []

      for (let i = 0; i < rotations; i++) {
        hueOffsets[i] = i * rotationStop
      }

      return getColorPaletteFromOffsets({ startingHue, hueShift, saturation, saturationShift, dynamicRange, hueOffsets })
    }
    function getColorPaletteFromOffsets({ startingHue, hueShift, saturation, saturationShift, dynamicRange, hueOffsets }) {
      let range = []

      for (let i = 0; i < hueOffsets.length; i++) {
        let hue = startingHue + hueOffsets[i]
        range[i] = getColorRange({ dynamicRange, hueShift, startingHue: hue, saturation, saturationShift })
      }

      return range
    }
    function getColorRange({ dynamicRange, hueShift, startingHue, saturation, saturationShift }) {
      let yellowHue = 60
      let purpleHue = 300
      let stops = []

      let brightnessStop = 100 / (dynamicRange + 1)
      for (let i = 0; i < dynamicRange; i++) {
        let brightness = brightnessStop * (i + 1)
        let hue = brightness === 50 ? startingHue
          : brightness >= 50 ? Math.round(lerpTowardsCirclePoint(startingHue, yellowHue, (hueShift * (i - (dynamicRange / 2)))))
            : Math.round(lerpTowardsCirclePoint(startingHue, purpleHue, Math.abs(hueShift * (i - (dynamicRange / 2)))))
        let s = saturation + (saturationShift * -1 * i)
        stops[i] = [hue, s, brightness]
      }

      return stops
    }

    // update dom
    function createButtonsAndUpdateCssVariables(palette) {
      document.querySelector('#huePreview').innerText = ''

      let row = 0
      for (let range of palette) {
        let root = document.createElement('div')
        let column = 0

        for (let stop of range) {
          let variableName = `--c-${row}-${column}`

          document.documentElement.style.setProperty(variableName, cssColor(stop))
          let child = document.createElement('div')
          child.style = `
            background: var(${variableName});
            width: 100%;
            aspect-ratio: 1 / 1;
          `

          root.appendChild(child)
          column += 1
        }
        root.style = `
          display: flex;
          width: 100%;
        `

        document.querySelector('#huePreview').appendChild(root);
        row += 1
      }
    }

    function updateCanvas(palette) {
      const paletteCanvas = document.getElementById('paletteCanvas')
      paletteCanvas.width = paletteCanvas.clientWidth - 0.5
      paletteCanvas.height = paletteCanvas.clientHeight - 0.5

      const ctx = paletteCanvas.getContext("2d")
      ctx.clearRect(0, 0, paletteCanvas.width, paletteCanvas.height)

      const pointSize = paletteCanvas.height * 0.02
      const pointMidpoint = pointSize / 2
      const canvasCenter = paletteCanvas.width / 2

      // Draw points
      for (let range of palette) {
        for (let colorIndex = 0; colorIndex < range.length; colorIndex++) {
          let color = range[colorIndex]

          let [hue, saturation, brightness] = color

          let x = (hue) % 360

          let y = brightness - (pointMidpoint / 2)
          y = (y / 100) * canvasCenter

          ctx.save()
          ctx.translate(canvasCenter, canvasCenter)
          ctx.rotate(x * Math.PI / 180)
          ctx.translate(-canvasCenter, -canvasCenter)
          ctx.fillStyle = `hsl(${hue},${saturation}%,${brightness}%)`
          ctx.beginPath()
          ctx.arc(canvasCenter, y, pointSize, 0, 360)
          ctx.fill()
          ctx.strokeStyle = `black`
          ctx.lineWidth = 2
          ctx.stroke()
          ctx.restore()
        }
      }
    }

    // css export
    function cssColor([hue, saturation, brightness]) {
      // Hue is an angle and CSS clamps the percentages, so normalising here keeps
      // the exported CSS tidy without changing any colour it describes.
      let h = roundToTenth(((hue % 360) + 360) % 360)
      let s = roundToTenth(clampPercent(saturation))
      let l = roundToTenth(clampPercent(brightness))

      return `hsl(${h}, ${s}%, ${l}%)`
    }

    function clampPercent(value) { return Math.min(100, Math.max(0, value)) }
    function roundToTenth(value) { return Math.round(value * 10) / 10 }

    function getPaletteCss(palette) {
      let lines = [':root {']

      let row = 0
      for (let range of palette) {
        let column = 0

        for (let stop of range) {
          lines.push(`  --c-${row}-${column}: ${cssColor(stop)};`)
          column += 1
        }

        if (row < palette.length - 1) lines.push('')
        row += 1
      }

      lines.push('}')
      return lines.join('\n')
    }

    function updateCssExport(palette) {
      document.querySelector('#cssOutput code').textContent = getPaletteCss(palette)
      // The palette just changed, so any "Copied!" from a previous palette is stale.
      resetCopyButton()
    }

    async function copyCss() {
      let css = document.querySelector('#cssOutput code').textContent
      let copied = false

      // Only the clipboard call is guarded, so a failure below can't be mistaken
      // for the copy itself failing.
      try {
        await navigator.clipboard.writeText(css)
        copied = true
      } catch {
        // The clipboard API needs a secure context and permission.
      }

      if (copied) {
        flashCopyButton('copied', 'Copied!', 'Palette CSS copied to clipboard.')
      } else {
        // Select the CSS so it can still be copied by hand.
        selectCssOutput()
        flashCopyButton('failed', 'Press ⌘/Ctrl+C', 'Copying failed. The CSS is selected — press Command or Control C.')
      }
    }

    function flashCopyButton(state, label, status) {
      let button = document.querySelector('#copyCss')

      button.dataset.state = state
      button.textContent = label
      document.querySelector('#copyStatus').textContent = status

      clearTimeout(copyResetTimer)
      copyResetTimer = setTimeout(resetCopyButton, 2500)
    }

    function resetCopyButton() {
      let button = document.querySelector('#copyCss')

      clearTimeout(copyResetTimer)
      delete button.dataset.state
      button.textContent = 'Copy CSS'
      document.querySelector('#copyStatus').textContent = ''
    }

    function selectCssOutput() {
      let range = document.createRange()
      range.selectNodeContents(document.querySelector('#cssOutput code'))

      let selection = window.getSelection()
      selection.removeAllRanges()
      selection.addRange(range)
    }

    function hideRotations() { document.querySelector('#rotationsWrapper').style = 'display:none;' }
    function showRotations() { document.querySelector('#rotationsWrapper').style = 'display:flex;flex-direction:column;' }

    // Math
    function lerp(current, target, percent) {
      return current * (1 - percent) + target * percent;
    }

    function lerpTowardsCirclePoint(current, point, percent) {
      if (current > point + 180) {
        return lerp(current, point + 360, percent)
      } else if (current < point - 180) {
        return lerp(current, point - 360, percent)
      } else {
        return lerp(current, point, percent)
      }
    }
  </script>
</body>
</html>
