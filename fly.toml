# fly.toml app configuration file generated for portfoliage on 2026-07-24T14:15:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'portfoliage'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

[[statics]]
  guest_path = '/srv/http'
  url_prefix = '/'
