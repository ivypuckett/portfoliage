name: Deploy to Fly.io

# Deploys on every push to main. Add `workflow_dispatch` lets you also
# trigger a deploy by hand from the Actions tab.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys at once; a newer push cancels an in-flight deploy.
concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
